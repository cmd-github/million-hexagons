name: Staging availability
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: Send a test failure notification after the live health check
        required: false
        default: false
        type: boolean
  push:
    paths:
      - deploy/staging-monitor.json
      - scripts/staging-health.mjs
      - .github/workflows/staging-health.yml
permissions:
  contents: read
concurrency:
  group: staging-health
  cancel-in-progress: false
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/staging-health.mjs
      - name: Simulate requested alert
        if: ${{ inputs.simulate_failure }}
        run: |
          echo "Intentional failure requested to verify GitHub Actions alert delivery."
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-health
          path: artifacts/staging/health.json
          retention-days: 14
