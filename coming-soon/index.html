<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#061118" />
    <meta name="description" content="Million Hexagons | one shared 3D canvas. Only 1,000,000 spaces. Coming soon." />
    <title>Million Hexagons | Coming Soon</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main>
      <header class="brand" aria-label="Million Hexagons">
        <span class="brand-mark">MH</span>
        <span class="brand-name">Million<br /><strong>Hexagons</strong></span>
      </header>
      <section class="message">
        <p>One shared canvas. Only 1,000,000 spaces.</p>
        <h1>Claim your space.<br /><span>Launching soon.</span></h1>
      </section>
      <div class="launch-signup">
        <h2>Be first to know when we launch.</h2>
        <form id="launch-form" action="/api/launch-signup" method="post" novalidate>
          <label class="sr-only" for="launch-email">Email address</label>
          <div class="signup-row">
            <input id="launch-email" name="email" type="email" autocomplete="email" inputmode="email" placeholder="Email address" maxlength="254" required />
            <button type="submit">Notify me</button>
          </div>
          <div class="signup-trap" aria-hidden="true">
            <label for="launch-website">Website</label>
            <input id="launch-website" name="website" type="text" tabindex="-1" autocomplete="off" />
          </div>
          <p id="launch-status" class="signup-status" role="status" aria-live="polite"></p>
        </form>
        <a class="build-link" href="https://x.com/MillionHexagons" target="_blank" rel="noopener noreferrer">Follow the build on X <span aria-hidden="true">→</span><span class="sr-only"> (opens in a new tab)</span></a>
      </div>
      <canvas id="globe" aria-label="An interactive hexagonal globe displaying Million Hexagons and Coming Soon"></canvas>
      <p class="hint">Drag to explore</p>
    </main>
    <script type="module" src="/main.js"></script>
  </body>
</html>
